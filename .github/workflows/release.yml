name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Get tarball sha256
        id: sha
        run: |
          SHA=$(curl -sL "https://github.com/zackwag/media2mqtt/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: zackwag/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      - name: Update formulas
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"

          for formula in Formula/media2mqtt.rb Formula/media2mqtt-coordinator.rb; do
            sed -i -E "s#(archive/refs/tags/v)[0-9]+\.[0-9]+\.[0-9]+(\.tar\.gz)#\1${VERSION}\2#" "$formula"
            sed -i '0,/^  sha256 ".*"/{s/^  sha256 ".*"/  sha256 "'"$SHA"'"/}' "$formula"

            grep -q "v${VERSION}.tar.gz" "$formula" || {
              echo "::error::url in $formula was not updated to v${VERSION}"
              exit 1
            }
          done

      - name: Open PR against homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/media2mqtt.rb Formula/media2mqtt-coordinator.rb
          git diff --cached --quiet && exit 0

          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="update-media2mqtt-${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "chore(media2mqtt): update to ${VERSION}"
          git push origin "$BRANCH"

          gh pr create --repo zackwag/homebrew-tap --base main --head "$BRANCH" \
            --title "chore(media2mqtt): update to ${VERSION}" \
            --body "Automated update from a media2mqtt release."

          pr_number=$(gh pr list --repo zackwag/homebrew-tap --head "$BRANCH" --json number -q '.[0].number')
          sleep 20
          for i in $(seq 1 40); do
            total=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '.statusCheckRollup | length')
            pending=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '[.statusCheckRollup[] | select(.status!="COMPLETED")] | length')
            if [ "$total" != "0" ] && [ "$pending" = "0" ]; then break; fi
            sleep 15
          done

          bad=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '[.statusCheckRollup[] | select((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not)] | length')
          if [ "$bad" != "0" ]; then
            echo "::error::$bad check(s) did not succeed; leaving PR #$pr_number open for review."
            exit 1
          fi

          gh pr merge "$pr_number" --repo zackwag/homebrew-tap --squash --delete-branch
