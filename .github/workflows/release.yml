name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  update-homebrew:
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Get tarball sha256
        id: sha
        run: |
          SHA=$(curl -sL "https://github.com/zackwag/media2mqtt/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: zackwag/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      - name: Update formula
        run: |
          sed -i 's/^  version ".*"/  version "${{ steps.version.outputs.version }}"/' Formula/media2mqtt.rb
          sed -i '0,/^  sha256 ".*"/{s/^  sha256 ".*"/  sha256 "${{ steps.sha.outputs.sha256 }}"/}' Formula/media2mqtt.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/media2mqtt.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update media2mqtt to ${{ steps.version.outputs.version }}"
          git push
